# 仅由维护者从 main 手动触发的正式发布：动态工具链、完整门禁、草稿核对与公开后审计。
name: Release

on:
  workflow_dispatch:

concurrency:
  group: manual-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve resumable release state
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\resolve-release-state.ps1

      - name: Resolve latest upstream build tools
        id: toolchain
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 -RefreshBuildTools
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT
          "resolved=$($tools.ResolvedToolchainPath)" >> $env:GITHUB_OUTPUT

      - name: Run complete release validation
        shell: pwsh
        run: >-
          .\tools\invoke-release-validation.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'
          -ResolvedToolchainPath '${{ steps.toolchain.outputs.resolved }}'
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'
          -SoakSeconds 15
          -SecondPowerShellPath powershell.exe

      - name: Attest the two program editions and optional font package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-source.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-fonts.zip

      - name: Preserve all build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-watchdog-${{ steps.release_meta.outputs.version }}-all-build-outputs
          path: dist/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload the two program editions and optional font package to a draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 进程守护小助手 v${{ steps.release_meta.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: docs/release-notes/v${{ steps.release_meta.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-source.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-fonts.zip

      - name: Audit draft against source and local hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\verify-release-draft.ps1

      - name: Publish the verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit '${{ steps.release_meta.outputs.tag }}'
          --draft=false
          --latest

      - name: Audit published release and remote tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\verify-published-release.ps1

      - name: Download and audit the public packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .\tools\verify-downloaded-release.ps1
          -Version '${{ steps.release_meta.outputs.version }}'
          -CommitSha '${{ github.sha }}'
          -Repository '${{ github.repository }}'

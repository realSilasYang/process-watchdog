# 仅由维护者手动触发的正式发布流程：解析最新上游工具链、构建、校验并发布。
name: Release

on:
  workflow_dispatch:

concurrency:
  group: manual-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify release version and unpublished tag
        id: release_meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($version -notmatch '^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') {
            throw "VERSION is not a semantic version: $version"
          }
          $remoteTag = git ls-remote --exit-code --tags origin "refs/tags/v$version"
          $tagQueryExitCode = $LASTEXITCODE
          if ($tagQueryExitCode -notin @(0, 2)) {
            throw "Unable to query remote tag v$version."
          }
          $releasePages = gh api --paginate --slurp `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
            ConvertFrom-Json
          $releases = @($releasePages | ForEach-Object { $_ })
          $matchingReleases = @($releases | Where-Object {
            $_.tag_name -ceq "v$version"
          })
          if ($matchingReleases.Count -gt 1) {
            throw "More than one release exists for v$version."
          }
          if ($matchingReleases.Count -eq 1) {
            $release = $matchingReleases[0]
            if (-not $release.draft) {
              throw "Release v$version is already published; published versions are immutable."
            }
            if ([string]$release.target_commitish -cne $env:GITHUB_SHA) {
              throw "Draft release v$version belongs to another commit."
            }
            Write-Host "Resuming the existing draft release v$version."
          }
          elseif ($tagQueryExitCode -eq 0) {
            throw "Tag v$version exists without a resumable draft release."
          }
          if ($tagQueryExitCode -eq 0) {
            git fetch --force origin `
              "refs/tags/v$version`:refs/tags/v$version"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch existing draft tag v$version."
            }
            $remoteCommit = (git rev-list -n 1 "v$version").Trim()
            if ($remoteCommit -cne $env:GITHUB_SHA) {
              throw "Tag v$version already exists at another commit."
            }
          }
          # 退出码 2 已作为“标签不存在”处理；避免 Actions 的 pwsh 收尾逻辑
          # 把仍保留在 LASTEXITCODE 中的已处理状态重新解释为步骤失败。
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Resolve latest upstream build tools
        id: toolchain
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 -RefreshBuildTools
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT
          "resolved=$($tools.ResolvedToolchainPath)" >> $env:GITHUB_OUTPUT

      - name: Verify
        shell: pwsh
        run: >-
          .\tests\verify.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'

      - name: GUI smoke and resource soak
        shell: pwsh
        run: >-
          .\tests\run-gui-tests.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -SoakSeconds 15

      - name: Verify reproducible release package
        shell: pwsh
        run: >-
          .\tests\reproducible-build.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'
          -ResolvedToolchainPath '${{ steps.toolchain.outputs.resolved }}'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.exe
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-source.zip

      - name: Preserve all build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-watchdog-${{ steps.release_meta.outputs.version }}-all-build-outputs
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload assets to draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: false
          body_path: docs/release-notes/v${{ steps.release_meta.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.exe
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-windows-x64.zip
            dist/process-watchdog-${{ steps.release_meta.outputs.version }}-source.zip

      - name: Verify draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.release_meta.outputs.version }}'
          $expectedAssets = @(
            "process-watchdog-$version-source.zip"
            "process-watchdog-$version-windows-x64.exe"
            "process-watchdog-$version-windows-x64.zip"
          ) | Sort-Object
          $releasePages = gh api --paginate --slurp `
            'repos/${{ github.repository }}/releases?per_page=100' |
            ConvertFrom-Json
          $releases = @($releasePages | ForEach-Object { $_ })
          $matchingReleases = @($releases | Where-Object {
            $_.tag_name -ceq '${{ steps.release_meta.outputs.tag }}'
          })
          if ($matchingReleases.Count -ne 1) {
            throw 'The draft release could not be identified uniquely.'
          }
          $release = $matchingReleases[0]
          if (-not $release.draft) {
            throw 'The release became public before asset verification completed.'
          }
          if ([string]$release.target_commitish -cne $env:GITHUB_SHA) {
            throw 'The draft release points to an unexpected commit.'
          }
          $actualAssets = @($release.assets.name | Sort-Object)
          $difference = @(Compare-Object -CaseSensitive `
            -ReferenceObject $expectedAssets -DifferenceObject $actualAssets)
          if ($difference.Count -ne 0 -or
              $actualAssets.Count -ne $expectedAssets.Count) {
            throw "Draft release assets are incomplete or unexpected: $($actualAssets -join ', ')"
          }

      - name: Publish completed draft atomically
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit '${{ steps.release_meta.outputs.tag }}'
          --draft=false
          --latest

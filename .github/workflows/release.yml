name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version."
          }

      - name: Bootstrap pinned toolchain
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT

      - name: Verify
        shell: pwsh
        run: >-
          .\tests\verify.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'

      - name: GUI smoke and resource soak
        shell: pwsh
        run: >-
          .\tests\run-gui-tests.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -SoakSeconds 15

      - name: Verify reproducible release package
        shell: pwsh
        run: >-
          .\tests\reproducible-build.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/release/*.zip
            artifacts/release/*.spdx.json
            artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.spdx.json
            artifacts/release/SHA256SUMS.txt

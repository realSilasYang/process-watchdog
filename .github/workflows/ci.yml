# 提交与拉取请求的必需验证：固定 CI 工具链、完整检查、GUI 冒烟和可复现构建。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore verified tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/AutoHotkey-*
            .tools/Ahk2Exe-*
            .tools/actionlint-*
            .tools/gitleaks-*
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/ci-toolchain.resolved.json', 'tools/toolchain.lock.json') }}

      - name: Bootstrap repository CI toolchain snapshot
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 `
            -ResolvedToolchainPath .\tools\ci-toolchain.resolved.json
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT
          "resolved=$($tools.ResolvedToolchainPath)" >> $env:GITHUB_OUTPUT

      - name: Run complete release-shaped validation
        shell: pwsh
        run: >-
          .\tools\invoke-release-validation.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'
          -ResolvedToolchainPath '${{ steps.toolchain.outputs.resolved }}'
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'
          -SoakSeconds 15
          -SecondPowerShellPath powershell.exe

      - name: Preserve all build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-watchdog-ci-all-build-outputs
          path: dist/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

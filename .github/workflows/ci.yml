# 提交与拉取请求的必需验证：核心检查、GUI 冒烟和可复现构建。
name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve and bootstrap build toolchain
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT
          "resolved=$($tools.ResolvedToolchainPath)" >> $env:GITHUB_OUTPUT

      - name: Verify source and tests
        shell: pwsh
        run: >-
          .\tests\verify.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'

      - name: GUI smoke and resource soak
        shell: pwsh
        run: >-
          .\tests\run-gui-tests.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -SoakSeconds 15

      - name: Verify reproducible release package
        shell: pwsh
        run: >-
          .\tests\reproducible-build.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'
          -ResolvedToolchainPath '${{ steps.toolchain.outputs.resolved }}'

      - name: Upload release-shaped artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-watchdog-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.spdx.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# 分层持续集成：所有变更先走快速门禁，运行时变更再走真实 Windows/GUI，
# 主分支代码与发行工程变更才执行双宿主可复现打包。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.impact.outputs.integration }}
      release: ${{ steps.impact.outputs.release }}
    steps:
      - name: Checkout paths without large LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Classify required validation layers
        id: impact
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          .\tools\get-ci-impact.ps1
          -BaseSha $env:BASE_SHA
          -HeadSha $env:HEAD_SHA
          -GitHubOutput $env:GITHUB_OUTPUT

  fast:
    needs: changes
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout without large LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore verified tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/AutoHotkey-*
            .tools/Ahk2Exe-*
            .tools/actionlint-*
            .tools/gitleaks-*
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/ci-toolchain.resolved.json', 'tools/toolchain.lock.json') }}

      - name: Bootstrap repository CI toolchain snapshot
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 `
            -ResolvedToolchainPath .\tools\ci-toolchain.resolved.json
          "actionlint=$($tools.ActionlintPath)" >> $env:GITHUB_OUTPUT
          "gitleaks=$($tools.GitleaksPath)" >> $env:GITHUB_OUTPUT

      - name: Run fast required validation
        shell: pwsh
        run: >-
          .\tests\verify-fast.ps1
          -ActionlintPath '${{ steps.toolchain.outputs.actionlint }}'
          -GitleaksPath '${{ steps.toolchain.outputs.gitleaks }}'

  windows-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Checkout complete runtime assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore verified tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/AutoHotkey-*
            .tools/Ahk2Exe-*
            .tools/actionlint-*
            .tools/gitleaks-*
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/ci-toolchain.resolved.json', 'tools/toolchain.lock.json') }}

      - name: Bootstrap repository CI toolchain snapshot
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 `
            -ResolvedToolchainPath .\tools\ci-toolchain.resolved.json
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT

      - name: Run real Windows process and GUI integration
        shell: pwsh
        run: >-
          .\tests\verify-windows-integration.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -SoakSeconds 15

  release-package:
    needs:
      - changes
      - fast
    if: >-
      needs.fast.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.release == 'true' ||
       (github.event_name == 'push' &&
        needs.changes.outputs.integration == 'true'))
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout complete release assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore verified tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/AutoHotkey-*
            .tools/Ahk2Exe-*
            .tools/actionlint-*
            .tools/gitleaks-*
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/ci-toolchain.resolved.json', 'tools/toolchain.lock.json') }}

      - name: Bootstrap repository CI toolchain snapshot
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 `
            -ResolvedToolchainPath .\tools\ci-toolchain.resolved.json
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT
          "resolved=$($tools.ResolvedToolchainPath)" >> $env:GITHUB_OUTPUT

      - name: Build twice and verify reproducibility
        shell: pwsh
        run: >-
          .\tests\reproducible-build.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'
          -ResolvedToolchainPath '${{ steps.toolchain.outputs.resolved }}'
          -SecondPowerShellPath powershell.exe

      - name: Preserve all build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-watchdog-ci-all-build-outputs
          path: dist/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # 分支保护只依赖这个稳定检查名。验证层可以继续拆分、按变更范围跳过，
  # 但汇总门禁必须确认所有本轮应执行的作业确实成功。
  verify:
    name: verify
    if: always()
    needs:
      - changes
      - fast
      - windows-integration
      - release-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce selected validation layers
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          WINDOWS_RESULT: ${{ needs['windows-integration'].result }}
          RELEASE_RESULT: ${{ needs['release-package'].result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          RELEASE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' || (github.event_name == 'push' && needs.changes.outputs.integration == 'true') }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" || "$FAST_RESULT" != "success" ]]; then
            echo "::error::changes and fast validation must both succeed"
            exit 1
          fi

          require_result() {
            local name="$1"
            local actual="$2"
            local required="$3"
            if [[ "$required" == "true" ]]; then
              if [[ "$actual" != "success" ]]; then
                echo "::error::$name was required but finished as $actual"
                exit 1
              fi
            elif [[ "$actual" != "success" && "$actual" != "skipped" ]]; then
              echo "::error::$name was optional but finished as $actual"
              exit 1
            fi
          }

          require_result "windows-integration" "$WINDOWS_RESULT" "$INTEGRATION_REQUIRED"
          require_result "release-package" "$RELEASE_RESULT" "$RELEASE_REQUIRED"

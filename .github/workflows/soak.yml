# 定期执行长时间 GUI 资源循环，捕获短时冒烟测试难以发现的句柄增长。
name: Scheduled soak

on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: GUI resource soak duration
        required: false
        default: "1800"

permissions:
  contents: read

jobs:
  resource-soak:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Restore verified tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache
            .tools/AutoHotkey-*
            .tools/Ahk2Exe-*
            .tools/actionlint-*
            .tools/gitleaks-*
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/ci-toolchain.resolved.json', 'tools/toolchain.lock.json') }}
      - name: Bootstrap repository CI toolchain snapshot
        id: toolchain
        shell: pwsh
        run: |
          $tools = .\tools\bootstrap-toolchain.ps1 `
            -ResolvedToolchainPath .\tools\ci-toolchain.resolved.json
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
      - name: Run GUI resource soak
        shell: pwsh
        env:
          REQUESTED_SECONDS: ${{ inputs.seconds }}
        run: |
          $seconds = if ($env:REQUESTED_SECONDS) {
            [int]$env:REQUESTED_SECONDS
          } else {
            1800
          }
          .\tests\run-gui-tests.ps1 `
            -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}' `
            -SoakSeconds $seconds

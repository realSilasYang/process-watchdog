# 中文新功能建议表单。
# 表单要求从真实场景、期望流程和替代方案说明需求，并把对现有行为的微调
# 分流到“改进建议”，方便维护者按问题类型评估范围和优先级。
name: 功能建议（简体中文）
description: 提议当前尚不存在的新能力或完整工作流
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 新功能应从真实使用场景出发。对已有功能、界面或性能的优化，请改用“改进建议”模板。

  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 请用一段话说明希望新增什么能力。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 请说明谁会在什么情况下使用，以及现有功能为什么无法解决。
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: 期望工作流
      description: 请按实际操作顺序描述入口、设置、交互、结果和失败时的处理方式。
      placeholder: |
        1. 用户从……进入
        2. 选择或填写……
        3. 小助手应当……
        4. 如果……，则……
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 适用对象与边界情况
      description: 请说明适用于 EXE、快捷方式、脚本或哪些 Windows 场景，并列出已考虑的异常和边界情况。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果已有实现想法，可说明界面、配置、守护逻辑或兼容方式；这不是必填项。

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 请说明当前采用的临时方法，以及为什么仍需要新功能。

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与数据影响
      description: 请说明是否可能影响现有 watchdog.ini、守护语义、停止后恢复策略、撤销重做、管理员权限或系统集成。

  - type: textarea
    id: notes
    attributes:
      label: 补充信息或界面参考
      description: 可附参考产品、草图、截图、相关 Issue 或经过脱敏的示例。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true
        - label: 我描述的是新的用户能力，而不是已有功能的缺陷或小幅优化。
          required: true
